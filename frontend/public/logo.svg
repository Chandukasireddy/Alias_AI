<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="28" fill="#0f1115" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#262a33" stroke-width="1.5" />

  <!-- Subtle Radial Glow -->
  <circle cx="64" cy="64" r="44" fill="url(#glowGrad)" />

  <!-- Outer Airgap Shield -->
  <path d="M64 24 L94 38 V66 C94 85.5 81.2 101.4 64 106 C46.8 101.4 34 85.5 34 66 V38 Z"
        fill="#14181f"
        stroke="url(#shieldGrad)"
        stroke-width="4"
        stroke-linejoin="round" />

  <!-- Inner Geometric Airgap Delta (Zero-Leakage Barrier) -->
  <path d="M64 36 L84 46 V65 C84 78 75.5 89 64 93 C52.5 89 44 78 44 65 V46 Z"
        fill="url(#shieldGrad)"
        opacity="0.15" />

  <!-- Delta Core Symbol -->
  <polygon points="64,44 78,74 50,74" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linejoin="round" />
  <circle cx="64" cy="65" r="4" fill="#4ade80" filter="url(#shieldGlow)" />
</svg>

