name: 🐛 Bug Report
description: Create a report to help us improve Alias AI
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: Alias AI Version & OS
      placeholder: "e.g. Alias AI v0.1.0 on Windows 11 / macOS Sequoia"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or prompt that caused the issue (remember to redact any real secrets).
      placeholder: "1. Run alias-ai start\n2. Type prompt: ..."
    validations:
      required: true

