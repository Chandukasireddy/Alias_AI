apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alias-gateway-backend-hpa
  namespace: alias-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alias-gateway-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alias-cockpit-frontend-hpa
  namespace: alias-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alias-cockpit-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
